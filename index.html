<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hitung Mundur Tugas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#1b2a6b">
<style>
:root{
  --paper:#f4f8fc; --line:#cfdcec; --margin:#e5484d; --ink:#1b2a6b; --muted:#5a6a8f;
  --card:#ffffff; --hl:#ffe45c; --hl-ink:#1b2a6b; --done:#2f8f5b;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10162b; --line:#222c4d; --margin:#ff6b70; --ink:#e8edff; --muted:#9aa7cf;
    --card:#18203d; --hl:#ffd93d; --hl-ink:#10162b; --done:#5fd392;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10162b; --line:#222c4d; --margin:#ff6b70; --ink:#e8edff; --muted:#9aa7cf;
  --card:#18203d; --hl:#ffd93d; --hl-ink:#10162b; --done:#5fd392; color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; background-color:var(--paper); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);
}
.wrap{max-width:560px; margin:0 auto; padding:20px 16px 48px 36px; position:relative; min-height:100vh}
.wrap::before{content:""; position:absolute; left:20px; top:0; bottom:0; width:2px; background:var(--margin); opacity:.7}
h1{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; font-weight:800; font-size:30px; line-height:1.1; margin:8px 0 4px}
.sub{color:var(--muted); margin:0 0 20px}
.card{background:var(--card); border:2px solid var(--ink); border-radius:14px; padding:16px; margin-bottom:16px; box-shadow:4px 4px 0 var(--ink)}
.card.done{border-color:var(--done); box-shadow:4px 4px 0 var(--done)}
.top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start}
.name{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; font-weight:800; font-size:20px; margin:0; overflow-wrap:anywhere}
.when{color:var(--muted); font-size:14px; margin:2px 0 12px}
.del{background:none; border:0; color:var(--muted); font:inherit; font-size:14px; padding:6px 8px; cursor:pointer; border-radius:8px}
.del:hover,.del:focus-visible{color:var(--margin); outline:2px solid var(--margin)}
.units{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.u{background:var(--hl); color:var(--hl-ink); border-radius:10px; text-align:center; padding:10px 2px}
.u b{display:block; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; font-weight:800; font-size:clamp(26px,9vw,40px); line-height:1; font-variant-numeric:tabular-nums}
.u span{font-size:13px}
.total{margin:12px 0 0; padding:0; list-style:none; color:var(--muted); font-size:14px; font-variant-numeric:tabular-nums}
.total li{padding:2px 0; border-top:1px dashed var(--line)}
.total li:first-child{border-top:0}
.bar{height:8px; background:var(--line); border-radius:99px; margin-top:12px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--ink); border-radius:99px}
.finished{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; font-weight:800; font-size:24px; color:var(--done); margin:4px 0 0}
form{background:var(--card); border:2px dashed var(--muted); border-radius:14px; padding:16px}
form h2{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; font-size:18px; margin:0 0 12px}
label{display:block; font-weight:700; font-size:14px; margin:0 0 4px}
input{width:100%; font:inherit; color:var(--ink); background:var(--paper); border:2px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px}
input:focus-visible{outline:3px solid var(--hl); border-color:var(--ink)}
button.add{width:100%; font:inherit; font-weight:800; background:var(--ink); color:var(--paper); border:0; border-radius:10px; padding:12px; cursor:pointer}
button.add:focus-visible{outline:3px solid var(--hl); outline-offset:2px}
.err{color:var(--margin); font-size:14px; min-height:20px; margin:0 0 8px}
.empty{color:var(--muted); text-align:center; padding:12px 0 24px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Hitung mundur tugas</h1>
  <p class="sub">Tambahkan ulangan, tugas, atau acara. Waktunya berjalan otomatis.</p>
  <div id="list" aria-live="off"></div>
  <form id="f">
    <h2>Tambah pengingat</h2>
    <label for="n">Nama</label>
    <input id="n" maxlength="80" placeholder="Contoh: Ulangan semester ganjil" required>
    <label for="d">Tanggal dan jam</label>
    <input id="d" type="datetime-local" required>
    <p class="err" id="e" role="alert"></p>
    <button class="add" type="submit">Simpan pengingat</button>
  </form>
</div>
<script>
(function(){
  var KEY="hitung-mundur-v1", items=[], list=document.getElementById("list");
  var DEFAULT=[{id:"a1",name:"Ulangan semester ganjil",at:"2026-11-30T07:00",start:Date.now()}];
  function load(){
    try{var r=localStorage.getItem(KEY); if(r){var p=JSON.parse(r); if(Array.isArray(p)) return p;}}catch(e){}
    return DEFAULT.slice();
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){}}
  function pad(n){return String(n).padStart(2,"0");}
  function fmt(n){return n.toLocaleString("id-ID");}
  var fmtDate=new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  function render(){
    if(!items.length){list.innerHTML='<p class="empty">Belum ada pengingat. Tambahkan satu di bawah.</p>';return;}
    list.innerHTML=items.map(function(it){
      return '<article class="card" id="c-'+it.id+'"><div class="top"><div><h2 class="name">'+esc(it.name)+'</h2>'+
        '<p class="when">'+fmtDate.format(new Date(it.at))+'</p></div>'+
        '<button class="del" data-id="'+it.id+'" aria-label="Hapus '+esc(it.name)+'">Hapus</button></div>'+
        '<div class="body"></div></article>';
    }).join("");
  }
  function tick(){
    var now=Date.now();
    items.forEach(function(it){
      var card=document.getElementById("c-"+it.id); if(!card) return;
      var body=card.querySelector(".body"), target=new Date(it.at).getTime(), diff=target-now;
      if(diff<=0){
        card.classList.add("done");
        body.innerHTML='<p class="finished">Waktunya tiba!</p>';
        return;
      }
      card.classList.remove("done");
      var s=Math.floor(diff/1000), d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60), sc=s%60;
      var span=Math.max(target-(it.start||now),1), pct=Math.min(100,Math.max(0,(now-(it.start||now))/span*100));
      body.innerHTML=
        '<div class="units"><div class="u"><b>'+d+'</b><span>hari</span></div><div class="u"><b>'+pad(h)+'</b><span>jam</span></div>'+
        '<div class="u"><b>'+pad(m)+'</b><span>menit</span></div><div class="u"><b>'+pad(sc)+'</b><span>detik</span></div></div>'+
        '<ul class="total"><li>'+fmt(d)+' hari lagi</li><li>'+fmt(Math.floor(s/3600))+' jam lagi</li><li>'+fmt(Math.floor(s/60))+' menit lagi</li><li>'+fmt(s)+' detik lagi</li></ul>'+
        '<div class="bar" aria-hidden="true"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
    });
  }
  list.addEventListener("click",function(ev){
    var b=ev.target.closest(".del"); if(!b) return;
    items=items.filter(function(i){return i.id!==b.getAttribute("data-id");});
    save(); render(); tick();
  });
  document.getElementById("f").addEventListener("submit",function(ev){
    ev.preventDefault();
    var n=document.getElementById("n"), d=document.getElementById("d"), e=document.getElementById("e");
    var name=n.value.trim();
    if(!name||!d.value){e.textContent="Isi nama dan tanggal dulu.";return;}
    if(new Date(d.value).getTime()<=Date.now()){e.textContent="Pilih waktu yang belum lewat.";return;}
    e.textContent="";
    items.push({id:"i"+Date.now(),name:name,at:d.value,start:Date.now()});
    items.sort(function(a,b){return new Date(a.at)-new Date(b.at);});
    save(); n.value=""; d.value=""; render(); tick();
  });
  items=load(); render(); tick(); setInterval(tick,1000);
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
})();
</script>
</body>
</html>
